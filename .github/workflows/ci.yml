name: Continous Integration

on:
  push:
    branches:
      - feature/**
      - release
      - hotfix

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build da Aplicação
        run: mvn clean package
      - name: Execução de teste unitários
        run: mvn test
      - name: Teste de Build da Imagem
        run: docker build -t study-apir .
